name: test

on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The ffmpeg build the app bundles (packaging/ffmpeg.env); distro
      # versions vary too much to test against.
      - name: Fetch ffmpeg
        run: |
          packaging/fetch-ffmpeg.sh linux ffmpeg-bin
          echo "SG_FFMPEG_DIR=$PWD/ffmpeg-bin" >> "$GITHUB_ENV"
      - run: out=$(gofmt -l .); echo "$out"; test -z "$out"
      # The desktop app is Windows-only; on Linux, Wails would need GTK headers.
      - run: go vet $(go list ./... | grep -v /cmd/app)
      - run: go test -race $(go list ./... | grep -v /cmd/app)

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fetch ffmpeg
        shell: bash
        run: |
          packaging/fetch-ffmpeg.sh windows ffmpeg-bin
          echo "SG_FFMPEG_DIR=$(cygpath -w "$PWD/ffmpeg-bin")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci && npm run build
        working-directory: frontend
      - run: go vet ./...
      - run: go test ./...
      - run: go build -ldflags "-H windowsgui" -o SubsplashGenerator.exe ./cmd/app
